<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master Pro - Ultimate Knowledge Challenge</title>
    <meta name="description" content="Test your knowledge with Quiz Master Pro. Challenge yourself with thousands of questions across various categories.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="light-theme">
    <div class="animated-background"></div>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">
                     <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z" fill="url(#grad1)"/><path d="M12 7a.997.997 0 00-1 1v2.586l-1.707 1.707a1 1 0 101.414 1.414L12 12.414V8a1 1 0 00-1-1zm5-2.268a1 1 0 00-1.053-.975A6.002 6.002 0 0012 3a6 6 0 00-4.947 2.757 1 1 0 101.493 1.32C9.53 5.92 10.72 5 12 5c1.28 0 2.47.92 3.453 2.082a1 1 0 001.493-1.32V4.732z" fill="url(#grad2)"/><defs><linearGradient id="grad1" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#667eea"/><stop offset="1" stop-color="#764ba2"/></linearGradient><linearGradient id="grad2" x1="7" y1="3" x2="17" y2="13" gradientUnits="userSpaceOnUse"><stop stop-color="#f093fb"/><stop offset="1" stop-color="#f5576c"/></linearGradient></defs></svg>
                    Quiz Master Pro
                </div>
                <div class="controls">
                    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
                        <i id="themeIcon" class="fas fa-moon"></i>
                    </button>
                    <!-- Potential for more controls here later -->
                </div>
            </div>

            <div id="homepage">
                <div class="welcome-section">
                    <h1 class="welcome-title">Test Your Knowledge</h1>
                    <p class="welcome-text">Challenge yourself with our expertly crafted questions and climb the leaderboard!</p>
                </div>
                
                <div class="setup-section">
                    <div style="margin-bottom: 1.5rem;">
                        <h3 class="setup-title">1. Choose Difficulty</h3>
                        <div class="options-group" id="difficulty-options">
                            <button class="option-btn selected" onclick="selectOption('difficulty', 'easy', this)">Easy</button>
                            <button class="option-btn" onclick="selectOption('difficulty', 'medium', this)">Medium</button>
                            <button class="option-btn" onclick="selectOption('difficulty', 'hard', this)">Hard</button>
                        </div>
                    </div>
                    <div>
                        <h3 class="setup-title">2. Select Game Mode</h3>
                        <div class="options-group" id="gamemode-options">
                            <button class="option-btn selected" onclick="selectOption('gamemode', 'classic', this)">Classic</button>
                            <button class="option-btn" onclick="selectOption('gamemode', 'time-rush', this)">Time Rush</button>
                            <button class="option-btn" onclick="selectOption('gamemode', 'sudden-death', this)">Sudden Death</button>
                        </div>
                    </div>
                </div>

                <div class="category-grid" id="categoryGrid">
                    <!-- Categories will be populated here -->
                </div>
            </div>

            <div id="quizpage" class="hidden">
                <div class="loading-section" id="loadingMessage">
                    <div class="spinner"></div>
                    <div class="loading-text">Preparing your challenge...</div>
                </div>
                
                <div id="quizContent" class="hidden">
                    <div class="question-header">
                        <div class="question-counter">
                            Question <span id="currentQuestion">1</span>
                        </div>
                        <div class="timer-container">
                            <div class="timer-circle" id="timerCircle">30</div>
                            <div class="timer-label">seconds</div>
                        </div>
                    </div>

                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 20%"></div>
                    </div>

                    <div class="question-section">
                        <div class="question-text" id="questionText"></div>
                        <div class="options-container" id="optionsContainer"></div>
                    </div>
                    
                    <div class="lifeline-section">
                        <button class="lifeline-btn" id="fiftyFiftyBtn" onclick="useFiftyFifty()" title="50:50 - Remove two wrong answers">
                            50:50
                        </button>
                    </div>

                    <div class="stats-section">
                        <div class="stat-card">
                            <div class="stat-value" id="currentScore">0</div>
                            <div class="stat-label">Score</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="correctCount">0</div>
                            <div class="stat-label">Correct</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="streak">0</div>
                            <div class="stat-label">Streak</div>
                        </div>
                    </div>

                    <button class="btn btn-outline" onclick="endQuiz(false)" id="endQuizBtn">
                        <i class="fas fa-stop"></i> End Quiz
                    </button>
                </div>
            </div>

            <div id="resultpage" class="hidden">
                <div class="result-section">
                    <h1 class="result-title">Quiz Complete!</h1>
                    
                    <div class="performance-message" id="performanceMessage"></div>

                    <div class="stats-section" id="resultStats">
                        <!-- Result stats populated by JS -->
                    </div>

                    <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 2rem;">
                        <button class="btn" onclick="restartQuiz()">
                            <i class="fas fa-redo"></i> Play Again
                        </button>
                        <button class="btn btn-outline" onclick="goHome()">
                            <i class="fas fa-home"></i> Home
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="celebration" id="celebration"></div>

    <script src="assets/js/app.js"></script>
</body>
</html>
